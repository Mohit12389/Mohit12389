name: GitHub Profile Summary Cards

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write        # required so the action can commit the SVGs back
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Create this secret in: Settings -> Secrets and variables -> Actions
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5.5     # India Standard Time — makes the productive-time card accurate
          EXCLUDE: ""         # e.g. "html,css" to hide languages you don't want counted
          AUTO_PUSH: true
